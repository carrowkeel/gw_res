base_config: configs/sim.yaml
sweep_name: sim-round6
stages: [simtrain]

teachers:
  - tag: sizing-rot
    overrides:
      templatesft:
        teacher_sizing: true
        teacher_rotation: true
        numeric_token_weight: 3.0
  - tag: sizing-rot-skeptic
    overrides:
      templatesft:
        teacher_sizing: true
        teacher_rotation: true
        advisor_accuracy: 0.7
        numeric_token_weight: 3.0
  - tag: sizing-rot-var
    overrides:
      templatesft:
        teacher_sizing: true
        teacher_rotation: true
        input_variety: true
        numeric_token_weight: 3.0

common:
  simtrain:
    listener_mode: pattern
    decision_format: structured
    base_stage: templatesft-sizing-rot
    rehearsal_source: templatesft-sizing-rot
    curriculum:
      - from_step: 0
        field_count: 2
        companies_per_field: 2
      - from_step: 60
        field_count: 3
        companies_per_field: 2
      - from_step: 120
        field_count: 4
        companies_per_field: 3

variants:
  - name: control
    overrides: {}
  - name: control-seed
    overrides:
      project:
        seed: 2338
  - name: dense
    overrides:
      simtrain:
        report_coverage: 0.9
  - name: widest
    overrides:
      simtrain:
        curriculum:
          - from_step: 0
            field_count: 3
            companies_per_field: 3
          - from_step: 60
            field_count: 4
            companies_per_field: 4
          - from_step: 120
            field_count: 4
            companies_per_field: 5
  - name: dense-widest
    overrides:
      simtrain:
        report_coverage: 0.9
        curriculum:
          - from_step: 0
            field_count: 3
            companies_per_field: 3
          - from_step: 60
            field_count: 4
            companies_per_field: 4
          - from_step: 120
            field_count: 4
            companies_per_field: 5
  - name: thinning
    overrides:
      simtrain:
        report_coverage: 0.9
        report_coverage_final: 0.4
  - name: stack
    overrides:
      simtrain:
        report_coverage: 0.9
        report_coverage_final: 0.4
        curriculum:
          - from_step: 0
            field_count: 3
            companies_per_field: 3
          - from_step: 60
            field_count: 4
            companies_per_field: 4
          - from_step: 120
            field_count: 4
            companies_per_field: 5
  - name: advisor-90
    overrides:
      simtrain:
        advisor_accuracy: 0.9
  - name: advisor-anneal
    overrides:
      simtrain:
        curriculum:
          - from_step: 0
            field_count: 2
            companies_per_field: 2
            advisor_accuracy: 1.0
          - from_step: 60
            field_count: 3
            companies_per_field: 2
            advisor_accuracy: 0.9
          - from_step: 120
            field_count: 4
            companies_per_field: 3
            advisor_accuracy: 0.8
  - name: skeptic
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-skeptic
        rehearsal_source: templatesft-sizing-rot-skeptic
  - name: skeptic-90
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-skeptic
        rehearsal_source: templatesft-sizing-rot-skeptic
        advisor_accuracy: 0.9
  - name: skeptic-70
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-skeptic
        rehearsal_source: templatesft-sizing-rot-skeptic
        advisor_accuracy: 0.7
  - name: skeptic-anneal
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-skeptic
        rehearsal_source: templatesft-sizing-rot-skeptic
        curriculum:
          - from_step: 0
            field_count: 2
            companies_per_field: 2
            advisor_accuracy: 1.0
          - from_step: 60
            field_count: 3
            companies_per_field: 2
            advisor_accuracy: 0.9
          - from_step: 120
            field_count: 4
            companies_per_field: 3
            advisor_accuracy: 0.8
  - name: var-taught
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-var
        rehearsal_source: templatesft-sizing-rot-var
        input_variety: true
  - name: var-taught-widest
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-var
        rehearsal_source: templatesft-sizing-rot-var
        input_variety: true
        curriculum:
          - from_step: 0
            field_count: 3
            companies_per_field: 3
          - from_step: 60
            field_count: 4
            companies_per_field: 4
          - from_step: 120
            field_count: 4
            companies_per_field: 5
  - name: stack-var
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-var
        rehearsal_source: templatesft-sizing-rot-var
        input_variety: true
        report_coverage: 0.9
        report_coverage_final: 0.4
        curriculum:
          - from_step: 0
            field_count: 3
            companies_per_field: 3
          - from_step: 60
            field_count: 4
            companies_per_field: 4
          - from_step: 120
            field_count: 4
            companies_per_field: 5
