base_config: configs/sim.yaml
sweep_name: sim-round5
stages: [simtrain]

common:
  simtrain:
    listener_mode: pattern
    decision_format: structured
    base_stage: templatesft-sizing
    rehearsal_source: templatesft-sizing
    curriculum:
      - from_step: 0
        field_count: 2
        companies_per_field: 2
      - from_step: 60
        field_count: 3
        companies_per_field: 2
      - from_step: 120
        field_count: 4
        companies_per_field: 3

variants:
  - name: control
    overrides: {}
  - name: wider
    overrides:
      simtrain:
        curriculum:
          - from_step: 0
            field_count: 2
            companies_per_field: 3
          - from_step: 60
            field_count: 3
            companies_per_field: 3
          - from_step: 120
            field_count: 4
            companies_per_field: 4
  - name: widest
    overrides:
      simtrain:
        curriculum:
          - from_step: 0
            field_count: 3
            companies_per_field: 3
          - from_step: 60
            field_count: 4
            companies_per_field: 4
          - from_step: 120
            field_count: 4
            companies_per_field: 5
  - name: dense
    overrides:
      simtrain:
        report_coverage: 0.9
  - name: thinning
    overrides:
      simtrain:
        report_coverage: 0.9
        report_coverage_final: 0.4
  - name: noise-mid
    overrides:
      simtrain:
        market_noise_sigma: 2.5
  - name: variety
    overrides:
      simtrain:
        input_variety: true
  - name: variety-wide
    overrides:
      simtrain:
        input_variety: true
        curriculum:
          - from_step: 0
            field_count: 2
            companies_per_field: 3
          - from_step: 60
            field_count: 3
            companies_per_field: 3
          - from_step: 120
            field_count: 4
            companies_per_field: 4
  - name: advisor-90
    overrides:
      simtrain:
        advisor_accuracy: 0.9
  - name: advisor-70
    overrides:
      simtrain:
        advisor_accuracy: 0.7
  - name: advisor-50
    overrides:
      simtrain:
        advisor_accuracy: 0.5
  - name: advisor-anneal
    overrides:
      simtrain:
        curriculum:
          - from_step: 0
            field_count: 2
            companies_per_field: 2
            advisor_accuracy: 1.0
          - from_step: 60
            field_count: 3
            companies_per_field: 2
            advisor_accuracy: 0.8
          - from_step: 120
            field_count: 4
            companies_per_field: 3
            advisor_accuracy: 0.6
  - name: rotation
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot
        rehearsal_source: templatesft-sizing-rot
  - name: rotation-advisor
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot
        rehearsal_source: templatesft-sizing-rot
        advisor_accuracy: 0.7
  - name: order-clause
    overrides:
      simtrain:
        loss_scope: order_clause
  - name: combo
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot
        rehearsal_source: templatesft-sizing-rot
        input_variety: true
        advisor_accuracy: 0.7
        curriculum:
          - from_step: 0
            field_count: 2
            companies_per_field: 3
          - from_step: 60
            field_count: 3
            companies_per_field: 3
          - from_step: 120
            field_count: 4
            companies_per_field: 4
