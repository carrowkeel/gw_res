base_config: configs/sim.yaml
sweep_name: sim-round4
stages: [simtrain]

common:
  simtrain:
    listener_mode: pattern
    decision_format: structured
    base_stage: templatesft
    rehearsal_source: template

variants:
  - name: control
    overrides: {}
  - name: sizing
    overrides:
      simtrain:
        base_stage: templatesft-sizing
        rehearsal_source: templatesft-sizing
        market_noise_sigma: 3.0
  - name: sizing-calm
    overrides:
      simtrain:
        base_stage: templatesft-sizing
        rehearsal_source: templatesft-sizing
  - name: numeric-both
    overrides:
      simtrain:
        numeric_reports: both
  - name: numeric-anneal
    overrides:
      simtrain:
        numeric_reports: both
        curriculum:
          - from_step: 0
            field_count: 1
            companies_per_field: 2
          - from_step: 60
            field_count: 2
          - from_step: 120
            field_count: 3
            numeric_reports: only
  - name: numeric-only
    overrides:
      simtrain:
        numeric_reports: only
  - name: sizing-numeric
    overrides:
      simtrain:
        base_stage: templatesft-sizing
        rehearsal_source: templatesft-sizing
        market_noise_sigma: 3.0
        numeric_reports: both
        curriculum:
          - from_step: 0
            field_count: 1
            companies_per_field: 2
          - from_step: 60
            field_count: 2
          - from_step: 120
            field_count: 3
            numeric_reports: only
  - name: numeric-variety
    overrides:
      simtrain:
        numeric_reports: both
        input_variety: true
