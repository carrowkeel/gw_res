base_config: configs/sim.yaml
sweep_name: sim-round7
stages: [simtrain]

teachers:
  - tag: sizing-rot-var
    overrides:
      templatesft:
        teacher_sizing: true
        teacher_rotation: true
        input_variety: true
        numeric_token_weight: 3.0
  - tag: sizing-rot-skeptic
    overrides:
      templatesft:
        teacher_sizing: true
        teacher_rotation: true
        advisor_accuracy: 0.7
        numeric_token_weight: 3.0
  - tag: sizing-rot-full
    overrides:
      templatesft:
        teacher_sizing: true
        teacher_rotation: true
        input_variety: true
        advisor_accuracy: 0.7
        numeric_token_weight: 3.0

common:
  simtrain:
    listener_mode: pattern
    decision_format: structured
    base_stage: templatesft-sizing-rot-var
    rehearsal_source: templatesft-sizing-rot-var
    input_variety: true
    report_coverage: 0.9
    report_coverage_final: 0.4
    curriculum:
      - from_step: 0
        field_count: 3
        companies_per_field: 3
      - from_step: 60
        field_count: 4
        companies_per_field: 4
      - from_step: 120
        field_count: 4
        companies_per_field: 5

variants:
  - name: control
    overrides: {}
  - name: seed
    overrides:
      project:
        seed: 2338
  - name: skeptic
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-skeptic
        rehearsal_source: templatesft-sizing-rot-skeptic
        input_variety: false
  - name: full
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-full
        rehearsal_source: templatesft-sizing-rot-full
  - name: full-90
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-full
        rehearsal_source: templatesft-sizing-rot-full
        advisor_accuracy: 0.9
  - name: var-90
    overrides:
      simtrain:
        advisor_accuracy: 0.9
  - name: long
    overrides:
      simtrain:
        maximum_steps: 300
  - name: full-long
    overrides:
      simtrain:
        base_stage: templatesft-sizing-rot-full
        rehearsal_source: templatesft-sizing-rot-full
        advisor_accuracy: 0.9
        maximum_steps: 300
  - name: low-lr
    overrides:
      simtrain:
        learning_rate: 0.000015
  - name: high-lr
    overrides:
      simtrain:
        learning_rate: 0.00006
  - name: thin-3
    overrides:
      simtrain:
        report_coverage_final: 0.3
  - name: no-rehearse
    overrides:
      simtrain:
        rehearsal_fraction: 0.0
  - name: no-advisor
    overrides:
      simtrain:
        advisor_coverage: 0.0
  - name: flat-max
    overrides:
      simtrain:
        field_count: 4
        companies_per_field: 5
        curriculum: []
  - name: long-games
    overrides:
      simtrain:
        quarters: 16
  - name: sharp-weights
    overrides:
      simtrain:
        weight_temperature: 0.5
