base_config: configs/sim.yaml
sweep_name: sim-round3
stages: [simtrain]

common:
  simtrain:
    listener_mode: pattern
    decision_format: structured
    base_stage: templatesft
    rehearsal_source: template

variants:
  - name: advisor-anneal
    overrides:
      simtrain:
        curriculum:
          - from_step: 0
            field_count: 1
            companies_per_field: 2
            advisor_coverage: 1.0
          - from_step: 60
            field_count: 2
            advisor_coverage: 0.6
          - from_step: 120
            field_count: 3
            advisor_coverage: 0.2
  - name: no-advisor
    overrides:
      simtrain:
        advisor_coverage: 0.0
  - name: scarce
    overrides:
      simtrain:
        report_coverage: 0.4
        advisor_coverage: 0.2
  - name: synonyms
    overrides:
      simtrain:
        input_variety: true
  - name: synonyms-anneal
    overrides:
      simtrain:
        input_variety: true
        curriculum:
          - from_step: 0
            field_count: 1
            companies_per_field: 2
            advisor_coverage: 1.0
          - from_step: 60
            field_count: 2
            advisor_coverage: 0.6
          - from_step: 120
            field_count: 3
            advisor_coverage: 0.2
  - name: order-clause-anneal
    overrides:
      simtrain:
        loss_scope: order_clause
        curriculum:
          - from_step: 0
            field_count: 1
            companies_per_field: 2
            advisor_coverage: 1.0
          - from_step: 60
            field_count: 2
            advisor_coverage: 0.6
          - from_step: 120
            field_count: 3
            advisor_coverage: 0.2
  - name: wide-world
    overrides:
      simtrain:
        curriculum:
          - from_step: 0
            field_count: 2
            companies_per_field: 2
          - from_step: 60
            field_count: 3
            companies_per_field: 2
          - from_step: 120
            field_count: 4
            companies_per_field: 3
  - name: high-noise
    overrides:
      simtrain:
        market_noise_sigma: 3.0
