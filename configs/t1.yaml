project:
  name: sgm-t1
  out_dir: runs/t1
  seed: 1337

generate:
  default_model: Qwen/Qwen2.5-7B-Instruct
  type_models: {}
  text_type_weights:
    document: 1.0
    dialogue: 2.0
  number_of_texts: 10000
  number_of_pairs: 0
  temperature: 1.0
  top_p: 0.95
  frequency_penalty: 0.4
  max_tokens: 1024
  workers: 4
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_model_len: 2048
  dtype: bfloat16
  batch_size: 512
  apply_filter: true
  deduplicate: true
  minimum_characters: 200

tokenizer:
  vocabulary_size: 8000
  minimum_frequency: 2

model:
  preset: pico
  block_size: 1024
  dropout: 0.15
  tie_embeddings: true

pretrain:
  batch_size: 32
  effective_batch_size: 128
  gradient_accumulation_steps: 4
  maximum_steps: 3000
  learning_rate: 0.0006
  minimum_learning_rate: 0.00006
  warmup_steps: 100
  weight_decay: 0.1
  gradient_clip: 1.0
  dtype: bfloat16
  compile_model: true
  log_interval: 20
  evaluation_interval: 50
  evaluation_iterations: 40
  checkpoint_interval: 100
  validation_fraction: 0.02
  early_stop_patience: 6
  instruction_fraction: 0.0

commsft:
  number_of_dialogues: 2000
  holdout_fraction: 0.05
  minimum_turns: 5
  maximum_turns: 8
  conversation_max_tokens: 360
  batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 2
  learning_rate: 0.00003
  minimum_learning_rate: 0.000003
  warmup_ratio: 0.03
  replay_fraction: 0.2
  evaluation_interval: 50
  log_interval: 20

mathsft:
  number_of_dialogues: 12000
  holdout_fraction: 0.05
  maximum_value: 1000
  communication_fraction: 0.3
  numeric_token_weight: 5.0
  batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 1
  learning_rate: 0.00003
  minimum_learning_rate: 0.000003
  warmup_ratio: 0.03
  replay_fraction: 0.2
  evaluation_interval: 50
  log_interval: 20

bridgesft:
  number_of_dialogues: 2000
  qa_fraction: 0.35
  decision_fraction: 0.2
  probe_records: 100
  holdout_fraction: 0.05
  maximum_value: 1000
  minimum_turns: 3
  maximum_turns: 9
  conversation_max_tokens: 360
  numeric_token_weight: 5.0
  batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 1
  learning_rate: 0.00003
  minimum_learning_rate: 0.000003
  warmup_ratio: 0.03
  replay_fraction: 0.2
  evaluation_interval: 50
  log_interval: 20

sfteval:
  max_new_tokens: 64
  temperature: 0.3
  top_p: 0.9
  similarity_threshold: 0.4
  maximum_examples: 100
  sample_dump: 25

eval:
  judge_model: null
  number_of_generation_samples: 40
  number_of_probe_questions: 40
  max_new_tokens: 200
  temperature: 0.8
  top_p: 0.95
  repetition_penalty: 1.0
  student_gpu_memory_utilization: 0.45
  judge_gpu_memory_utilization: 0.45

slurm:
  enabled: true
  partition: null
  account: null
  gres: gpu:l40s:1
  memory: 64G
  cpus_per_task: 8
  time_limit: "08:00:00"
  pretrain_gres: null
  log_dir: runs/t1/slurm_logs
  extra_sbatch: []
